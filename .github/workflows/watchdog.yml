name: watchdog (prod /api health)

# 외부 GH-hosted runner에서 cron */2분 헬스체크.
# Mac mini 다운 시 self-hosted runner도 같이 죽으므로 외부 runner 필수.
#
# 흐름: curl https://www.dstcraft.com/api/_debug/health × 3회
#   - 1~2회 실패 → workflow 성공 + Telegram 경고 (degraded)
#   - 3회 모두 실패 → workflow 실패(빨간 X) + Telegram 긴급
#
# Phase 6 (CF DNS swap) 활성 시: vars.WATCHDOG_FAILOVER=1 + secrets.CF_API_TOKEN/CF_ZONE_ID 등록
#   → 3/3 실패 시 dstcraft.com / www CNAME을 Vercel 대상으로 자동 rollback (Phase 6 후속).

on:
  schedule:
    - cron: "*/5 * * * *"   # GH Actions 최소 5분 — 더 빠른 cadence는 plan 필요
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Probe https://www.dstcraft.com/api/_debug/health
        id: check
        run: |
          set +e
          fails=0
          last_status=""
          last_err=""
          for i in 1 2 3; do
            body=$(curl -fsS -m 5 -w "\n[HTTPCODE]%{http_code} [TIME]%{time_total}s" \
              -H "Cache-Control: no-cache" \
              "https://www.dstcraft.com/api/_debug/health?cb=$(date +%s%N)" 2>&1)
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "[try #$i] ok"
            else
              fails=$((fails + 1))
              last_status=$(printf '%s' "$body" | grep -oE '\[HTTPCODE\][0-9]+' | head -1 | sed 's/\[HTTPCODE\]//')
              last_err=$(printf '%s' "$body" | head -c 200 | tr '\n' ' ')
              echo "[try #$i] FAIL rc=$rc status=$last_status err=$last_err"
            fi
            [ "$i" -lt 3 ] && sleep 2
          done

          {
            echo "fails=$fails"
            echo "last_status=$last_status"
            echo "last_err=$last_err"
          } >> "$GITHUB_OUTPUT"

          if [ "$fails" -ge 3 ]; then
            echo "::error::Mac mini API 3/3 down. status=$last_status err=$last_err"
            exit 1
          fi

      # 1/3 실패는 transient noise라 무시. 2/3 부터 알림.
      - name: Telegram alert (degraded or down)
        if: always() && steps.check.outputs.fails >= '2'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILS: ${{ steps.check.outputs.fails }}
          STATUS: ${{ steps.check.outputs.last_status }}
          LAST_ERR: ${{ steps.check.outputs.last_err }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "no telegram secrets, skipping alert"
            exit 0
          fi
          icon="⚠️"
          [ "$FAILS" = "3" ] && icon="🔥"
          text="$icon dstcraft.com /api 헬스 ${FAILS}/3 실패"$'\n'"http: ${STATUS:-?} · err: ${LAST_ERR:-?}"$'\n'"run: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode "text=$text" >/dev/null

      # 자동 복구: 3/3 실패 시 Mac mini에 SSH로 launchctl kickstart로 bun-api 강제 재시작.
      # KeepAlive(Crashed:true)는 hang을 잡지 못하므로 워치독 측에서 강제 kick.
      # 활성화 조건: vars.WATCHDOG_AUTORECOVER=1 + secrets.TS_AUTHKEY (Tailscale ephemeral) + secrets.SSH_PRIVATE_KEY
      #              + vars.WATCHDOG_MACMINI_HOST (Tailscale IP/host) + vars.WATCHDOG_MACMINI_USER.
      # Mac mini ~/.ssh/authorized_keys에 SSH_PRIVATE_KEY의 공개키가 등록돼야 함.
      - name: Connect to Tailscale (auto-recover)
        if: |
          failure() &&
          steps.check.outputs.fails == '3' &&
          vars.WATCHDOG_AUTORECOVER == '1'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest

      - name: Kickstart bun-api on Mac mini (auto-recover)
        if: |
          failure() &&
          steps.check.outputs.fails == '3' &&
          vars.WATCHDOG_AUTORECOVER == '1'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MAC_MINI_HOST: ${{ vars.WATCHDOG_MACMINI_HOST }}
          MAC_MINI_USER: ${{ vars.WATCHDOG_MACMINI_USER }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_MINI_HOST" ] || [ -z "$MAC_MINI_USER" ]; then
            echo "::error::WATCHDOG_AUTORECOVER=1이지만 vars.WATCHDOG_MACMINI_HOST / WATCHDOG_MACMINI_USER 미설정"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # StrictHostKeyChecking=accept-new — 첫 접속 시 자동 추가 (Tailscale 내부망이라 안전)
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            "$MAC_MINI_USER@$MAC_MINI_HOST" \
            'launchctl kickstart -k "gui/$(id -u)/com.dstcraft.api" && echo "[recover] kickstart issued"'
          echo "[recover] SSH command sent. Waiting 15s for restart..."
          sleep 15

      - name: Re-check after auto-recover
        if: |
          failure() &&
          steps.check.outputs.fails == '3' &&
          vars.WATCHDOG_AUTORECOVER == '1'
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 5 "https://www.dstcraft.com/api/_debug/health" >/dev/null 2>&1; then
              echo "[recover] ok after attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API still down after auto-recover attempt"
          exit 1

      - name: Telegram alert (auto-recover result)
        if: |
          always() &&
          steps.check.outputs.fails == '3' &&
          vars.WATCHDOG_AUTORECOVER == '1'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          if [ "$JOB_STATUS" = "success" ]; then
            text="🛠 watchdog: 자동 복구 성공 — bun-api kickstart 후 헬스 정상"
          else
            text="🚨 watchdog: 자동 복구 실패 — 수동 확인 필요"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" --data-urlencode "text=$text" >/dev/null

      # Phase 6 활성 시 (vars.WATCHDOG_FAILOVER=1) 3/3 실패면 CF DNS를 Vercel로 자동 rollback.
      - name: Auto DNS rollback to Vercel (Phase 6+)
        if: |
          failure() &&
          steps.check.outputs.fails == '3' &&
          vars.WATCHDOG_FAILOVER == '1'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          VERCEL_TARGET: ${{ vars.WATCHDOG_VERCEL_CNAME }}
        run: |
          set -euo pipefail
          # GH UI에서 붙여넣을 때 trailing \n 등 whitespace가 따라들어가 CF API 400을 일으킨 사례 있음 → 모두 trim.
          CF_API_TOKEN=$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')
          CF_ZONE_ID=$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')
          VERCEL_TARGET=$(printf '%s' "$VERCEL_TARGET" | tr -d '[:space:]')
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ] || [ -z "$VERCEL_TARGET" ]; then
            echo "::error::WATCHDOG_FAILOVER=1이지만 CF_API_TOKEN / CF_ZONE_ID / WATCHDOG_VERCEL_CNAME 미설정"
            exit 1
          fi
          echo "config: zone=${CF_ZONE_ID:0:8}... target=$VERCEL_TARGET (len=${#VERCEL_TARGET})"

          for HOST in dstcraft.com www.dstcraft.com; do
            echo "::group::$HOST"
            REC=$(curl -fsS \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$HOST&type=CNAME")
            ID=$(printf '%s' "$REC" | grep -oE '"id":"[^"]+"' | head -1 | cut -d'"' -f4)
            CURRENT=$(printf '%s' "$REC" | grep -oE '"content":"[^"]+"' | head -1 | cut -d'"' -f4)
            echo "  id=$ID  current=$CURRENT"
            if [ -z "$ID" ]; then
              echo "  no CNAME record found, skip"
              echo "::endgroup::"
              continue
            fi
            if [ "$CURRENT" = "$VERCEL_TARGET" ]; then
              echo "  already pointing to Vercel ($CURRENT), no swap needed"
              echo "::endgroup::"
              continue
            fi
            echo "  swap $CURRENT → $VERCEL_TARGET"
            # body로 보낼 JSON을 변수로 빼서 정확히 무엇 보내는지 출력
            BODY=$(printf '{"content":"%s","proxied":true}' "$VERCEL_TARGET")
            echo "  body: $BODY"
            # -f 빼고 항상 body 캡처 (4xx도 응답 보임), -w로 status code 함께
            PATCH_RES=$(curl -sS -X PATCH \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              -w "\nHTTP:%{http_code}" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$ID")
            echo "  full response:"
            printf '%s\n' "$PATCH_RES" | sed 's/^/    /'
            if printf '%s' "$PATCH_RES" | grep -q '"success":true'; then
              echo "  ✓ swap success"
            else
              echo "::error::PATCH failed for $HOST"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Telegram alert (DNS swap done)
        if: |
          failure() &&
          steps.check.outputs.fails == '3' &&
          vars.WATCHDOG_FAILOVER == '1'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && exit 0
          text="🚨 watchdog: DNS auto-failover 실행됨 — dstcraft.com / www → Vercel"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" --data-urlencode "text=$text" >/dev/null
