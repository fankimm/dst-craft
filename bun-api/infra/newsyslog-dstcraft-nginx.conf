# nginx 로그 로테이션 (#77)
#
# 배경: access.log가 로테이션 없이 1.2GB까지 자랐다. nginx는 append라 크기 자체엔
# 둔감하지만, goaccess가 매시간 이 파일을 통째로 파싱하며 CPU 한 코어를 3분 넘게 물었다.
#
# 배포 (맥미니에서 1회):
#   sudo cp bun-api/infra/newsyslog-dstcraft-nginx.conf /etc/newsyslog.d/dstcraft-nginx.conf
#   sudo chown root:wheel /etc/newsyslog.d/dstcraft-nginx.conf
#   sudo newsyslog -nv                       # dry-run으로 파싱 확인
#   sudo newsyslog -F                        # 즉시 1회 강제 로테이션
# macOS의 com.apple.newsyslog가 30분마다 돌며 이후로는 자동 적용된다.
#
# sig_num 30 = SIGUSR1. nginx는 이 시그널을 받으면 로그 파일을 재오픈한다 —
# 이게 없으면 로테이션 후에도 nginx가 옛 inode에 계속 써서 새 파일이 0바이트로 남는다.
#
# 필드: logfilename [owner:group] mode count size when flags [/pid_file] [sig_num]
#   count 7   = 압축본 7개 보관
#   size      = KB 단위. 102400KB = 100MB 초과 시 로테이션
#   when *    = 시각 조건 없음 (크기 기준만)
#   flags Z   = gzip 압축
/usr/local/var/log/nginx/access.log  fankimm:admin  644  7  102400  *  Z  /usr/local/var/run/nginx.pid  30
/usr/local/var/log/nginx/error.log   fankimm:admin  644  5  10240   *  Z  /usr/local/var/run/nginx.pid  30
