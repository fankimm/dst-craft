# dstcraft 공통 nginx 룰 (beta + prod 공유)
# 호출자가 server_name + root + index 설정 후 include.

# Phase 3 — Bun API 프록시 (localhost:3001)
location /api/ {
  proxy_pass http://127.0.0.1:3001/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header CF-IPCountry $http_cf_ipcountry;
  proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  proxy_set_header Origin $http_origin;
  proxy_set_header Authorization $http_authorization;
  proxy_read_timeout 30s;
  proxy_connect_timeout 5s;
}

# Next.js static export — trailingSlash:false 정합성
# /foo, /foo/, /foo.html 셋 다 동일 컨텐츠를 서빙하기 위함.
# Next.js export는 보통 `foo.html`을 만들고 `foo/index.html`은 안 만들어서
# /foo/ 요청이 try_files로 직접 안 잡힘 → @stripslash fallback에서 .html로 rewrite.
#
# Cache-Control: try_files가 file을 직접 서빙할 때 다른 location의 헤더 안 적용되어
# /, /index.html 등에 Cache-Control이 누락 → CF가 default policy(수 시간)로 캐시 → 신규 빌드 propagation 지연.
# 명시적으로 짧은 max-age + SWR 헤더 부여.
location / {
  add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
  try_files $uri $uri.html $uri/index.html @stripslash;
}
location @stripslash {
  # /stats/ → /stats.html, /skill-tree/wilson/ → /skill-tree/wilson.html
  # rewrite 후 last로 location 재매칭 → \.html$ regex가 잡아 캐시 헤더까지 정상 적용
  rewrite ^(.+)/$ $1.html last;
  return 404;
}

# Service Worker / PWA manifest — 절대 캐시 금지 (옛 SW가 영구화되는 것 방지)
# 반드시 .js immutable location 위에 두기 (nginx exact match 우선)
location = /sw.js {
  expires off;
  add_header Cache-Control "public, max-age=0, must-revalidate";
  try_files $uri =404;
}
location = /manifest.webmanifest {
  expires off;
  add_header Cache-Control "public, max-age=0, must-revalidate";
  try_files $uri =404;
}

# 정적 자산 장기 캐시 (sw.js 제외 — 위 exact match가 먼저 잡힘)
location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|webp|ico)$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

# HTML은 짧게 (CF가 SWR 캐시)
location ~* \.html$ {
  expires 5m;
  add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
}
