# dstcraft 공통 nginx 룰 (beta + prod 공유)
# 호출자가 server_name + root + index 설정 후 include.

# keepalive 수명 — cloudflared의 --proxy-keep-alive-timeout(기본 90s)보다 길게 (#77).
# 짧으면 nginx가 먼저 idle 커넥션을 닫는데 cloudflared는 아직 유효하다고 믿고 재사용해서
# 불필요한 커넥션 재수립이 생긴다. http 기본값이 65s라 역전 상태였던 걸 바로잡은 것.
#
# 주의: cloudflared 로그의 "Unable to reach the origin service ...: EOF"는 이것과 무관하다.
# 대부분 아래 봇 차단 룰의 `return 444`가 만든 흔적이다 — 444는 응답 없이 커넥션을 닫으므로
# cloudflared 입장에선 EOF로 보인다. 즉 의도대로 동작한 결과지 장애가 아니다. #77에서
# 이걸 장애로 오독해 한참 헤맸으니, EOF 건수가 늘었다고 놀라지 말 것.
keepalive_timeout 120s;

# Real IP 복원 — 모든 트래픽이 CF Tunnel(127.0.0.1) 경유라 $remote_addr이 그대로면 로컬로 찍힘.
# CF가 위조 못 하는 CF-Connecting-IP 헤더를 신뢰 소스로 사용 → access_log/$remote_addr이 진짜 방문자 IP.
# goaccess/GeoIP 분석 정상화 + IP 기반 차단(아래 cloud-bot rule)이 의미 있게 동작.
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# 보안: 알려진 취약점 스캐너 경로 즉시 차단 (444 = nginx 전용 — 응답 없이 connection close).
# 워드프레스(/wp-*, xmlrpc.php), 시크릿(.env, .git/), PHP 디버그 등 우리 사이트와 무관한 path.
# 분석 결과: 3일간 100+ 건의 스캔 시도 (대부분 supply-chain 취약점 탐색 봇).
location ~* (^/wp-|^/wordpress/|^/wp-admin/|^/wp-includes/|^/\.env|^/\.git/|^/xmlrpc\.php|^/test\.php|^/phpinfo) {
  return 444;
}

# UA 기반 차단: 가치 없는 SEO 크롤러만 명시적으로 거부.
# 절대 차단 금지 (사이트 발견 채널):
#   - AI 검색: OAI-SearchBot, ChatGPT-User, PerplexityBot, Claude-Web, Bytespider, Applebot
#   - 검색 엔진: Googlebot, bingbot, NaverBot, DuckDuckBot
# 차단 대상은 자기 고객(SEO 분석 사이트) 위해서만 우리 콘텐츠를 가져가는 봇들.
if ($http_user_agent ~* "(AhrefsBot|MJ12bot|TLM-Audit-Scanner)") {
  return 444;
}

# IP 기반 차단 — 클라우드 데이터센터 봇 fleet (#19).
# 한국 DST 가이드 사이트라 합법 cloud-IP 트래픽은 0. CF Tunnel 뒤라 $remote_addr=127.0.0.1 →
# CF-Connecting-IP 헤더로 매칭 (CF가 위조하지 못하는 신뢰 가능한 헤더).
# 분석 (analytics_uv 2026-05-06~05-09): SG 335 IP / 1,341 PV ≈ 13.5%, 그 중 ~84%가 아래 대역.
# UA는 outdated Chrome 로테이션(104~145 무작위) + Sogou web spider — 명백한 봇 시그니처.
#   43.128.0.0/10  Tencent Cloud APAC (SG region) — 관측 280+ IP
#   43.119.0.0/16  ByteDance Volcengine SG
#   47.82.0.0/16   Alibaba Cloud SG
#   8.208.0.0/12   Alibaba Cloud HK/SG region
# CIDR-as-regex (geo/map은 http context 필요해 server-include 안 들어감):
#   second-octet 매칭 — Tencent: 119|128~191, Alibaba(8.x): 208~223
if ($http_cf_connecting_ip ~ "^(43\.(119|1(2[89]|[3-8][0-9]|9[01]))|47\.82|8\.(20[89]|21[0-9]|22[0-3]))\.") {
  return 444;
}

# Ezoic managed ads.txt (#55) — adstxtmanager로 301 리다이렉트 (Publisher ID 19390).
# exact match라 정적 파일 서빙보다 우선. authorized ad seller 목록을 Ezoic이 관리.
# 도메인은 prod(dstcraft.com) 고정 — Ezoic 심사 대상이 prod. beta도 이리로 리다이렉트되나 무해.
location = /ads.txt {
  return 301 https://srv.adstxtmanager.com/19390/dstcraft.com;
}

# Phase 3 — Bun API 프록시 (localhost:3001)
location /api/ {
  proxy_pass http://127.0.0.1:3001/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header CF-IPCountry $http_cf_ipcountry;
  proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  proxy_set_header Origin $http_origin;
  proxy_set_header Authorization $http_authorization;
  proxy_read_timeout 30s;
  proxy_connect_timeout 5s;
}

# Next.js static export — trailingSlash:false 정합성
# /foo, /foo/, /foo.html 셋 다 동일 컨텐츠를 서빙하기 위함.
# Next.js export는 보통 `foo.html`을 만들고 `foo/index.html`은 안 만들어서
# /foo/ 요청이 try_files로 직접 안 잡힘 → @stripslash fallback에서 .html로 rewrite.
#
# Cache-Control: try_files가 file을 직접 서빙할 때 다른 location의 헤더 안 적용되어
# /, /index.html 등에 Cache-Control이 누락 → CF가 default policy(수 시간)로 캐시 → 신규 빌드 propagation 지연.
# 명시적으로 짧은 max-age + SWR 헤더 부여.
location / {
  add_header Cache-Control $cache_html always;
  try_files $uri $uri.html $uri/index.html @stripslash;
}
location @stripslash {
  # /stats/ → /stats.html, /skill-tree/wilson/ → /skill-tree/wilson.html
  # rewrite 후 last로 location 재매칭 → \.html$ regex가 잡아 캐시 헤더까지 정상 적용
  rewrite ^(.+)/$ $1.html last;
  return 404;
}

# Service Worker / PWA manifest — 절대 캐시 금지 (옛 SW가 영구화되는 것 방지)
# 반드시 .js immutable location 위에 두기 (nginx exact match 우선)
location = /sw.js {
  expires off;
  add_header Cache-Control "public, max-age=0, must-revalidate";
  try_files $uri =404;
}
location = /manifest.webmanifest {
  expires off;
  add_header Cache-Control "public, max-age=0, must-revalidate";
  try_files $uri =404;
}

# 정적 자산 장기 캐시 (sw.js 제외 — 위 exact match가 먼저 잡힘)
location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|webp|ico)$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

# HTML은 server-context의 $cache_html에 따라 결정 (beta=no-store, prod=5분+SWR)
# expires 디렉티브는 자동 Cache-Control max-age 추가하므로 add_header와 충돌 → 사용 안 함.
location ~* \.html$ {
  add_header Cache-Control $cache_html always;
}
