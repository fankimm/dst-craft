# beta + prod 공통 location 블록 (path-only, server-context 무관)
# include로 두 server에 재사용 — 차이는 server_name + root + $cache_html 셋.
# $cache_html: HTML 응답의 Cache-Control 값 — beta는 매번 fresh, prod는 5분 + SWR.

# beta.dstcraft.com — Phase 1 + 3, fresh always
server {
  listen 8080;
  server_name beta.dstcraft.com;
  root /Users/fankimm/dstcraft/beta;
  index index.html;

  set $cache_html "no-store, must-revalidate";

  include /usr/local/etc/nginx/snippets/dstcraft-common.conf;
}

# dstcraft.com / www.dstcraft.com — Phase 6 cutover, 5분 캐시
server {
  listen 8080;
  server_name dstcraft.com www.dstcraft.com;
  root /Users/fankimm/dstcraft/prod;
  index index.html;

  # 5분 + SWR=24h 였으나 CF Free가 SWR로 24h까지 stale 서빙해서 신규 빌드 propagation이 길어짐.
  # max-age 60 + must-revalidate로 강제 재검증 → worst-case ~1분 propagation.
  set $cache_html "public, max-age=60, must-revalidate";

  include /usr/local/etc/nginx/snippets/dstcraft-common.conf;
}
